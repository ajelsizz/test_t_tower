<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Fantasy Town</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212; /* 레터박스 여백 색상 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #unity-canvas {
            /* 9:16 종횡비 유지 핵심 CSS */
            aspect-ratio: 9 / 16;
            width: auto;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: block;
        }
        /* 가로가 좁은 모바일 화면에서는 너비를 100%로 맞춤 */
        @media (max-aspect-ratio: 9/16) {
            #unity-canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <script>
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/888ee9714a2dcf6307fe4aa379dcdcb8.loader.js";
        var config = {
            dataUrl: buildUrl + "/393e4889c52075fb6fa7f7b5e9be3c22.data.br",
            frameworkUrl: buildUrl + "/46c8f61ecf2d3a613985aaae144c5844.framework.js.br",
            codeUrl: buildUrl + "/3d9576d1e9abd562659222ebc5677d1b.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "ajelsizz",
            productName: "Fantasy Town",
            productVersion: "1.5.0",
        };

        var canvas = document.querySelector("#unity-canvas");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // 로딩 프로그레스 필요 시 추가
            }).then((unityInstance) => {
                // 인스턴스 로드 완료
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
